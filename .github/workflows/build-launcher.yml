# Полная сборка Savage Wind на раннере GitHub: `make dist` — то же, что делает мейнтейнер для релиза.
# Кладётся в свой форк по пути .github/workflows/build-launcher.yml
#
# Два задания:
#   quick — обычный `make -j`, как у разработчика в MSYS2. Быстрая проверка, что код компилируется (~5 мин).
#   dist  — `make dist`: LGPL FFmpeg 9.0.2, замороженный генератор (swgen), компилятор zig (slim),
#           gamelib-src, шрифты, иконка. На выходе — готовый zip, как официальный релиз, только из своей ветки.
#
# Игровые файлы тут не нужны и не используются: generated/ отсутствует, поэтому make собирает
# только оболочку. Код игры по-прежнему компилируется на вашем ПК при первом запуске.

name: Build launcher (Windows)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick (MSYS2, console build)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-tools
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-zlib

      - name: Build
        run: make -j$(nproc)

      - name: Collect
        run: |
          mkdir -p out/quick
          cp build/savagewind.exe build/savagewind-config.exe build/savagewind.dll.a out/quick/

      - uses: actions/upload-artifact@v7
        with:
          name: savagewind-quick
          path: out/quick
          if-no-files-found: error
          retention-days: 30

  dist:
    name: Full release zip (make dist)
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-tools
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-zlib
            unzip
            zip

      # Python 3.12: tools/gen-helper замораживает swgen через PyInstaller, и нужны готовые wheels
      # unicorn / capstone (у MSYS2-шного Python их нет).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # FFmpeg 9.0.2 (LGPL) собирается один раз на версию скрипта, дальше берётся из кеша.
      # Кешируем результат, а не дерево сборки: скрипт пропускает сборку, если на месте lib/libavcodec.dll.a.
      - uses: actions/cache@v6
        with:
          path: |
            build/deps-win/lib
            build/deps-win/bin
            build/deps-win/include
            build/deps-win/src/ffmpeg-9.0.2.tar.xz
          key: deps-win-${{ hashFiles('tools/build_deps_windows.sh') }}

      # То же для компилятора: 50 МБ архива и распакованный zig, чтобы не тянуть каждый раз.
      - uses: actions/cache@v6
        with:
          path: |
            build/zig
            build/zig-dl
            build/zig-slim
          key: zig-${{ hashFiles('tools/fetch_zig.sh', 'tools/zig_slim.sh') }}

      - name: Build LGPL FFmpeg (make deps-windows)
        run: |
          # ffmpeg.org изредка недоступен с раннера: три попытки, скрипт продолжает с того же места.
          for i in 1 2 3; do
            if bash tools/build_deps_windows.sh; then exit 0; fi
            echo "::warning::deps-windows attempt $i failed, retrying"
            sleep 20
          done
          exit 1

      - name: Fetch zig
        run: |
          for i in 1 2 3; do
            if bash tools/fetch_zig.sh; then exit 0; fi
            echo "::warning::fetch_zig attempt $i failed, retrying"
            sleep 20
          done
          exit 1

      # make gen-helper создаёт venv и ждёт его в build/gen-venv/Scripts/python.exe; в MSYS2-шелле venv
      # получается с другой раскладкой, поэтому те же шаги делаются напрямую тем же PyInstaller'ом.
      - name: Freeze the game code generator (swgen)
        run: |
          python -V
          python -c "import sys; print(sys.executable)"
          python -m pip install -q capstone==5.0.9 unicorn==2.1.4 lz4==4.4.5 pyinstaller==6.22.3
          USERPROFILE="$(cygpath -w ~ 2>/dev/null || echo $HOME)" \
            python -m PyInstaller --noconfirm --clean --log-level WARN \
              --distpath build/helper --workpath build/pyinstaller tools/swgen.spec
          python tools/pe_no_cfg.py build/helper/swgen/swgen.exe
          du -sh build/helper/swgen

      - name: Package (make dist)
        run: make dist GEN_PY=python

      - name: Collect
        run: |
          mkdir -p out/dist
          cp build/dist/*.zip out/dist/
          ls -lh out/dist

      - uses: actions/upload-artifact@v7
        with:
          name: savagewind-release-zip
          path: out/dist
          if-no-files-found: error
          retention-days: 30
